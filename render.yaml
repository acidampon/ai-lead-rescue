services:
  - type: web
    name: ai-lead-rescue
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/acidampon/ai-lead-rescue
    branch: main
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veridexa-db
          property: connectionString
