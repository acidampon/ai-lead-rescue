services:
  - type: web
    name: ai-lead-rescue
    runtime: node
    plan: free
    region: oregon
    repo: https://github.com/acidampon/ai-lead-rescue
    branch: main
    buildCommand: npm install && npm run check && npm run smoke
    startCommand: npm start
    healthCheckPath: /api/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: veridexa-db
          property: connectionString
