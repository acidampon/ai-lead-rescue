<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact</title><style>body{font-family:system-ui;max-width:520px;margin:40px auto;padding:20px}input,textarea,button{width:100%;box-sizing:border-box;margin:8px 0;padding:12px}button{cursor:pointer}</style></head><body><h1>Send an enquiry</h1><p>Tell us what you need and our team will get back to you.</p><form id="f"><input name="name" placeholder="Name" required><input name="email" type="email" placeholder="Email"><input name="phone" placeholder="Phone"><textarea name="message" placeholder="How can we help?" required></textarea><button>Send enquiry</button></form><p id="m"></p><script>const token=new URLSearchParams(location.search).get('token');f.onsubmit=async e=>{e.preventDefault();const x=Object.fromEntries(new FormData(f));const r=await fetch('/api/public/leads',{method:'POST',headers:{'Content-Type':'application/json','X-Intake-Token':token},body:JSON.stringify(x)});const j=await r.json();m.textContent=j.ok?'Thanks — your enquiry has been received.':(j.error||'Something went wrong.');if(j.ok)f.reset()};</script></body></html>
